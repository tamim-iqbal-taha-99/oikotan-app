<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>সদস্য আবেদন | ঐকতান</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Tiro+Bangla&display=swap">
<style>
:root{--r:#c62828;--g:#2e7d32;--line:#d5ddd0;--ink:#1b2a1d;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#f6f8f4;color:var(--ink);font:400 1.05rem/1.7 "Hind Siliguri","Noto Sans Bengali",sans-serif}
h1,h2{font-family:"Tiro Bangla","Noto Serif Bengali",serif;font-weight:400;margin:0}
header{background:#fff;border-bottom:4px solid;border-image:linear-gradient(90deg,var(--r) 50%,var(--g) 50%) 1;padding:.6rem 1rem;display:flex;align-items:center;gap:.8rem}
header img{height:48px;border-radius:6px}header a{margin-left:auto;color:var(--g);font-weight:600;text-decoration:none}
main{max-width:820px;margin:auto;padding:1.2rem}
.tabs{display:flex;gap:.5rem;margin:.6rem 0 1rem;flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:1.2rem;margin-bottom:1rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}.full{grid-column:1/-1}
label{display:block;font-weight:600;margin:.7rem 0 .2rem}
input{font:inherit;width:100%;padding:.6rem .8rem;border:1px solid #9aa89c;border-radius:10px;background:#fff;color:var(--ink)}
button{font:inherit;cursor:pointer;border:2px solid var(--g);background:#fff;color:var(--g);padding:.55rem 1.3rem;border-radius:999px;font-weight:600}
button.p,button.on{background:var(--g);color:#fff}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.opt{border:2px solid var(--line);border-radius:12px;padding:.7rem;text-align:center;cursor:pointer;font-weight:600;margin:0}
.opt input{display:none}.opt:has(input:checked){border-color:var(--g);background:#e8f3e6}
.pay{background:#f1f6ee;border-radius:10px;padding:.6rem 1rem;margin-top:.8rem}
.num{font-size:1.5rem;font-weight:600;color:var(--g);letter-spacing:.05em}
.err{color:var(--r);font-weight:600;min-height:1.6em}
.big{font-size:2rem;font-weight:600;color:var(--g);letter-spacing:.1em}
#sheet{display:none;background:#fff;color:#000;font-size:13pt}
#sheet .top{text-align:center}#sheet .top img{height:110px}
#sheet h1{font-size:30pt;text-align:center;padding-bottom:4px;margin:6px 0 14px;border-bottom:3px solid;border-image:linear-gradient(90deg,var(--r) 50%,var(--g) 50%) 1}
#sheet .ph{float:right;width:34mm;height:40mm;border:1px solid #888;text-align:center;font-size:10pt;color:#555;padding-top:12mm;margin:0 0 8px 8px}
#sheet .cols{columns:2;column-gap:10mm;clear:both}
#sheet .cols div{break-inside:avoid;margin-bottom:9px;border-bottom:1px dotted #555;min-height:1.8em}
#sheet .c{text-align:center;margin:14px 0}#sheet h2{font-size:18pt;margin-top:12px}
#sheet .sig{display:flex;justify-content:space-between;margin:30px 0 16px;gap:10mm}
#sheet .foot{text-align:center;background:#e4f0e0;border-top:2px solid var(--r);border-bottom:2px solid var(--g);padding:5px}
@page{size:A4;margin:10mm}
@media print{body>*:not(#sheet){display:none!important}#sheet{display:block}body{background:#fff}}
@media(max-width:640px){.g2,.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><img src="/logo.jpg" alt="ঐকতান লোগো"><b>ঐকতান | সদস্য আবেদন</b><a href="/">← হোম</a></header>
<main>
<div class="tabs"><button id="t1" class="on" onclick="tab(1)">আবেদন করুন</button><button id="t2" onclick="tab(2)">অবস্থা দেখুন ও ফরম ডাউনলোড</button></div>

<div id="p1">
<form id="af" class="card">
  <h2>সদস্য ফরম</h2>
  <p>রেজিস্ট্রেশন ফী <b id="fee">২০০</b> টাকা। * চিহ্নিত ঘর পূরণ করতেই হবে।</p>
  <div class="g2" id="fields"></div>
  <h2 style="margin-top:1.4rem">ফী পরিশোধ</h2>
  <div class="opts">
    <label class="opt"><input type="radio" name="payMethod" value="bkash" checked>বিকাশ</label>
    <label class="opt"><input type="radio" name="payMethod" value="nagad">নগদ (Nagad)</label>
    <label class="opt"><input type="radio" name="payMethod" value="cash">সরাসরি হাতে হাতে</label>
  </div>
  <div class="pay" id="pinfo"></div>
  <div id="tx" class="g2">
    <div><label>যে নম্বর থেকে টাকা পাঠিয়েছেন *</label><input name="payNumber" inputmode="tel" maxlength="14" placeholder="01XXXXXXXXX"></div>
    <div><label>TrxID *</label><input name="trxId" maxlength="30" placeholder="যেমন: 9AB12CD3EF"></div>
  </div>
  <p class="err" id="err" role="alert"></p>
  <button class="p" type="submit">আবেদন জমা দিন</button>
</form>
<div id="done" class="card" hidden></div>
</div>

<div id="p2" hidden>
<form id="sf" class="card">
  <h2>আবেদনের অবস্থা</h2>
  <p>আবেদন জমা দেওয়ার সময় পাওয়া আইডি ও আপনার মোবাইল নম্বর দিন।</p>
  <div class="g2"><div><label>আবেদন আইডি</label><input name="appId" placeholder="OK-XXXXXX" required></div>
  <div><label>মোবাইল নম্বর</label><input name="phone" inputmode="tel" required></div></div>
  <p style="margin-top:1rem"><button class="p">দেখুন</button></p>
  <div id="res"></div>
</form>
</div>
</main>
<div id="sheet"></div>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const F=[['name','নাম',1],['father','পিতার নাম',1],['mother','মাতার নাম',1],['phone','মোবাইল',1],['nid','NID / জন্মনিবন্ধন নম্বর'],['education','শিক্ষাগত যোগ্যতা'],['institute','বর্তমান শিক্ষা প্রতিষ্ঠান'],['grade','শ্রেণী/বর্ষ'],['profession','পেশা'],['presentAddress','বর্তমান ঠিকানা',1],['permanentAddress','স্থায়ী ঠিকানা'],['bloodGroup','রক্তের গ্রুপ'],['emergency','জরুরী যোগাযোগ'],['skills','দক্ষতা']];
const PM={bkash:'বিকাশ',nagad:'নগদ (Nagad)',cash:'সরাসরি নগদ টাকা'};
const bn=n=>(+n).toLocaleString('bn-BD');
let cfg={fee:200,bkash:'',nagad:''},cur=null;
$('#fields').innerHTML=F.map(([k,l,r])=>`<div class="${['presentAddress','permanentAddress','skills'].includes(k)?'full':''}"><label>${l}${r?' *':''}</label><input name="${k}" ${r?'required':''} maxlength="200" ${k==='phone'?'inputmode="tel" placeholder="01XXXXXXXXX"':''}></div>`).join('');
function pay(){
  const m=document.querySelector('[name=payMethod]:checked').value,cash=m==='cash';
  $('#fee').textContent=bn(cfg.fee);
  $('#pinfo').innerHTML=cash
    ?`<p>কোনো নেতৃস্থানীয় সদস্যের হাতে <b>${bn(cfg.fee)} টাকা</b> জমা দিন। আবেদন জমা দিলে একটি আইডি পাবেন, সেটি তাঁকে জানান। টাকা পেলে তিনি আপনার আবেদন অনুমোদন করবেন।</p>`
    :`<p>নিচের নম্বরে <b>${bn(cfg.fee)} টাকা Send Money</b> করুন (${PM[m]}):</p><div class="num">${esc(cfg[m]||'নম্বর শীঘ্রই জানানো হবে')}</div><p>তারপর নিচে আপনার নম্বর ও TrxID লিখুন। আমরা মিলিয়ে দেখে অনুমোদন করব।</p>`;
  $('#tx').hidden=cash;$('#tx').querySelectorAll('input').forEach(i=>i.required=!cash);
}
document.querySelectorAll('[name=payMethod]').forEach(r=>r.onchange=pay);
fetch('/api/config').then(r=>r.json()).then(c=>{cfg=c;pay()}).catch(()=>{});pay();
function tab(n){$('#p1').hidden=n!==1;$('#p2').hidden=n!==2;$('#t1').className=n===1?'on':'';$('#t2').className=n===2?'on':'';history.replaceState(null,'',n===2?'#status':'#')}
if(location.hash==='#status')tab(2);

$('#af').onsubmit=async e=>{
  e.preventDefault();$('#err').textContent='';
  const b=Object.fromEntries(new FormData(e.target));
  try{
    const r=await fetch('/api/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||'আবেদন পাঠানো যায়নি। তথ্য (বিশেষ করে মোবাইল নম্বর) মিলিয়ে দেখুন।');
    e.target.hidden=true;const x=$('#done');x.hidden=false;
    x.innerHTML=`<h2>আপনার আবেদন জমা হয়েছে ✔</h2><p>আবেদন আইডি:</p><div class="big">${esc(d.appId)}</div><p><b>এই আইডি ও আপনার মোবাইল নম্বর সংরক্ষণ করুন।</b></p><p>${b.payMethod==='cash'?'কোনো নেতৃস্থানীয় সদস্যের কাছে টাকা জমা দিয়ে আইডিটি জানান। টাকা পাওয়ার পর আপনার আবেদন অনুমোদিত হবে।':'আপনার পেমেন্ট যাচাই করে আবেদন অনুমোদন করা হবে।'} অনুমোদনের পর “অবস্থা দেখুন” থেকে ফরম ডাউনলোড করতে পারবেন।</p><button class="p" onclick="tab(2);document.querySelector('#sf [name=appId]').value='${esc(d.appId)}'">অবস্থা দেখুন</button>`;
    scrollTo(0,0);
  }catch(x){$('#err').textContent=x.message}
};

$('#sf').onsubmit=async e=>{
  e.preventDefault();const o=$('#res');o.innerHTML='';
  try{
    const r=await fetch('/api/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});
    const d=await r.json();
    if(!r.ok){o.innerHTML=`<p class="err">${esc(d.error)}</p>`;return}
    cur=d;const st=d.status||'pending';
    o.innerHTML=st==='approved'
      ?`<p><b>অভিনন্দন ${esc(d.name)}! আপনার আবেদন অনুমোদিত হয়েছে ✔</b></p><p>ফরমটি প্রিন্ট করুন (বা “PDF হিসেবে সেভ করুন” বেছে নিন), পাসপোর্ট সাইজ ছবি লাগান, স্বাক্ষর করে কোনো নেতৃস্থানীয় সদস্যের কাছে জমা দিন।</p><button class="p" type="button" onclick="printSheet()">ফরম প্রিন্ট / PDF সেভ</button>`
      :st==='rejected'
      ?`<p class="err">আপনার আবেদন বাতিল হয়েছে।${d.note?' কারণ: '+esc(d.note):''}</p>`
      :`<p>আপনার আবেদন যাচাই করা হচ্ছে (${PM[d.payMethod]||''})। টাকা বা পেমেন্ট নিশ্চিত হলে অনুমোদন করা হবে, কিছুক্ষণ পর আবার দেখুন।</p>`;
  }catch{o.innerHTML='<p class="err">সংযোগে সমস্যা, আবার চেষ্টা করুন।</p>'}
};

function printSheet(){
  const d=cur;
  $('#sheet').innerHTML=`<div class="top"><img src="/logo.jpg" alt=""></div><div class="ph">পাসপোর্ট সাইজ ছবি<br><br>ছবি লাগাবেন</div><h1>ঐকতান - সদস্য ফরম</h1>
  <div class="cols">${F.map(([k,l],i)=>`<div>${bn(i+1)}. ${l} : <b>${esc(d[k])}</b></div>`).join('')}</div>
  <p class="c">রেজিস্ট্রেশন ফী : ${bn(cfg.fee)} টাকা (পরিশোধিত: ${PM[d.payMethod]||''}, আইডি: ${esc(d.appId)})</p>
  <h2>ঘোষণা:</h2><p>আমি প্রতিজ্ঞা করছি যে, উপরের প্রদত্ত সকল তথ্য আমার জানামতে সম্পূর্ণ সত্য ও সঠিক এবং আমি ঐকতান সংগঠনের গঠনতন্ত্র, নিয়মনীতি ও আদর্শ মেনে সদস্য হিসেবে দায়িত্ব ও কর্তব্য পালন করব।</p>
  <div class="sig"><div>আবেদনকারীর স্বাক্ষর :<br>তারিখ : ..................</div><div>অনুমোদনকারী কর্মকর্তার স্বাক্ষর :<br>তারিখ : ..................</div></div>
  <div class="foot">● এটি একটি অরাজনৈতিক সামাজিক সংগঠন ●</div>`;
  print();
}
</script>
</body>
</html>
